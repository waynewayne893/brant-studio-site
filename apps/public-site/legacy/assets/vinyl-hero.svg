<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Artistic monochrome still life of a vinyl record on textured paper">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4e0d9"/><stop offset=".5" stop-color="#bcb8b1"/><stop offset="1" stop-color="#777672"/></linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dad6cf"/><stop offset=".55" stop-color="#a5a198"/><stop offset="1" stop-color="#85847d"/></linearGradient>
    <radialGradient id="record" cx="42%" cy="36%" r="75%"><stop stop-color="#52504f"/><stop offset=".3" stop-color="#101111"/><stop offset=".6" stop-color="#292828"/><stop offset=".88" stop-color="#080a0b"/><stop offset="1" stop-color="#383838"/></radialGradient>
    <radialGradient id="label" cx="50%" cy="50%" r="60%"><stop stop-color="#b4a29a"/><stop offset=".5" stop-color="#a38a82"/><stop offset="1" stop-color="#554a49"/></radialGradient>
    <linearGradient id="shine" x1=".1" y1=".1" x2=".9" y2=".9"><stop stop-color="#fff" stop-opacity=".3"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".33" numOctaves="3" seed="13"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter>
  </defs>
